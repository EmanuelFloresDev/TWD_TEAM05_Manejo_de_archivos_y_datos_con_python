<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Manejo de Archivos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-xl shadow-md max-w-md w-full space-y-4">
        <div class="text-center">
            <h1 class="text-xl font-bold text-gray-800">Manejo de archivos y datos</h1>
            <p class="text-xs text-gray-500">Demo con Flask (.txt, .csv, .json)</p>
        </div>

        <form action="/procesar" method="POST" enctype="multipart/form-data" class="flex flex-col gap-2">
            <label class="text-[10px] font-bold text-gray-400 uppercase">1. Analizar Archivo (.txt / .csv / .json)</label>
            <input type="file" name="archivo" accept=".txt, .csv, .json" required class="text-xs text-gray-600 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:bg-gray-100">
            <button type="submit" class="bg-black hover:bg-gray-800 text-white text-xs font-semibold py-2 rounded">Subir y Analizar Archivo</button>
        </form>

        <hr>

        <div>
            <h2 class="text-xs font-bold text-gray-700 mb-2">Resultados en historial.json</h2>
            <ul class="space-y-2 text-xs max-h-48 overflow-y-auto pr-1">
                {% for item in historial %}
                    <li class="p-2 bg-gray-50 rounded border flex justify-between items-center">
                        <div>
                            <p class="font-bold text-gray-800">{{ item.nombre }}</p>
                            <p class="text-[11px] text-gray-500"><b class="text-blue-600">{{ item.categoria }}:</b> {{ item.detalle }}</p>
                        </div>
                        <span class="font-mono bg-gray-200 px-1.5 py-0.5 rounded text-[10px]">{{ item.tipo }}</span>
                    </li>
                {% else %}
                    <p class="text-center text-gray-400 text-xs">Sin registros procesados.</p>
                {% endfor %}
            </ul>
        </div>
    </div>

</body>
</html>
