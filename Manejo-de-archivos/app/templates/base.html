<!DOCTYPE html>
<html lang="es">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manejo de Archivos y Datos</title>
    <!-- Tailwind CSS vía CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- Definimos el diseño general de la página -->
<body class="bg-slate-900   text-white   min-h-screen   flex flex-col   justify-between">
   
    <!--Parte superior de la pagina-->
    <header class="p-6  border-b  border-slate-800  text-center">
        <h1 class="text-3xl  font-bold  text-blue-400">Manejo de Archivos y Datos con Python</h1>
        <p class="text-slate-400   text-sm   mt-1">Lectura, escritura, procesamiento y prevención de errores</p>
    </header>
    
    <!--Define el espacio donde se colocará el contenido de cada página.-->
    <main class="container  mx-auto  p-6  flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="p-4   border-t   border-slate-800   text-center   text-slate-500   text-sm">
        Demo - Manejo de Archivos
    </footer>
    
    <script src="{{ url_for('static', filename='js/style.js') }}"></script>
    
</body>
</html>
